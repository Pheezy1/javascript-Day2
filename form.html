<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pheezy form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <div>
        <div>
            <form>
                <label for="surname">Surname:</label>
                <input type="text" placeholder="Enter your surname" name="surname" id="" required> <br> <br>
                <label for="firstname">Firstname:</label>
                <input type="text" placeholder="Enter your first name" name="firstname" id="" required> <br> <br>
                <label for="middlename">Middlename:</label>
                <input type="text" placeholder="Enter your middle name" name="middlename" id="" required> <br> <br>
                <label for="number">Phone Number:</label>
                <input type="tel" placeholder="Enter your phone number" name="number" id="" required> <br> <br>
                <label for="email">Email:</label>
                <input type="email" placeholder="Enter your email" name="email" id="" required> <br> <br>
                <label for="address">Address:</label>
                <input type="text" placeholder="Enter your address" name="address" id="" required> <br> <br>
                <label for="password">Password:</label>
                <input type="password" placeholder="Enter your password" name="password" id="" required> <br> <br>
                <label for="dob">Date of Birth:</label>
                <input type="date" placeholder="Enter your Date of Birth" name="dob" id="dob" min="2002-01-01" max="2027-01-01" required> <br> <br>
            </form>



            <form action="/submit-form" method="POST">
                <label for="city/state">Choose a City/State:</label>
                <select id="City/State" name="City/State" required>
                   <option value="" disabled selected>Select your City/State</option>
                   <option value="Ab">Abia</option>
                   <option value="YL">Yola</option>
                   <option value="Os">Osun</option>
                   <option value="Kw">Kwara</option>
                   <option value="Lg">Lagos</option>
                   <option value="Og">Ogun</option> 
                </select>
                 
            </form> <br>

            <form action="/submit-form" method="POST">
                <label for="country">Choose a Country:</label>
                <select id="country" name="country" required>
                   <option value="" disabled selected>Select your country</option>
                   <option value="US">United States</option>
                   <option value="CA">Canada</option>
                   <option value="GB">United Kingdom</option>
                   <option value="NG">Nigeria</option>
                   <option value="GH">Ghana</option>
                   <option value="Ch">China</option>
                </select>
                
            </form> <br>

            <form action="/upload" method="POST" enctype="multipart/form-data">
                <label for="documents">Upload  Documents:</label>
                <input type="file" id="documents" name="documents" accept=".jpg,.jpeg,.png,.webp"> <br>
    
                <button type="submit"><b>Upload</b></button>
            </form>

           <form>
              <h2>Choose Gender/Language(s)</h2>
              <label for="">male</label>
              <input type="radio" name="gender"  Required/> 
              <label for="">Female</label>
              <input type="radio" name="gender" id="" Required> 
              <br> <br>
              <label for="">English</label>
              <input type="checkbox" required > 
              <label for="">Yoruba</label>
              <input type="checkbox" > 
              <label for="">Hausa</label> 
              <input type="checkbox" value> <br> <br>
              <label for="comment">Your Comment:</label>
              <textarea placeholder="Enter your message here..." rows="2" cols="30" required></textarea> <br> <br> <br>


              <button>Submit</button>
           </form>

        </div>
    </div>
</body>
</html>
