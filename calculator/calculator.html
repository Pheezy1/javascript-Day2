<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator-container">
        <form class="calculator">
            <input type="text" class="display" readonly placeholder="0">
            <div class="buttons-grid">
                <button type="button" class="btn btn-clear">C</button>
                <button type="button" class="btn btn-operator-div">/</button>
                <button type="button" class="btn btn-operator-mul">*</button>
                <button type="button" class="btn btn-operator-sub">-</button>
                <button type="button" class="btn btn-num-7">7</button>
                <button type="button" class="btn btn-num-8">8</button>
                <button type="button" class="btn btn-num-9">9</button>
                <button type="button" class="btn btn-plus-vertical">+</button>
                <button type="button" class="btn btn-num-4">4</button>
                <button type="button" class="btn btn-num-5">5</button>
                <button type="button" class="btn btn-num-6">6</button>
                <button type="button" class="btn btn-num-1">1</button>
                <button type="button" class="btn btn-num-2">2</button>
                <button type="button" class="btn btn-num-3">3</button>
                <button type="button" class="btn btn-dot">.</button>
                <button type="submit" class="btn btn-equals-horizontal">=</button>
                <button type="button" class="btn btn-num-0">0</button>
            </div>
        </form>
    </div>
</body>
</html>
