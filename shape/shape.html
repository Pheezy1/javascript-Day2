<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shapes</title>
    <link rel="stylesheet" href="shape.css">
</head>
<body>
    <h1 id="MY-SHAPES">MY SHAPES</h1>
    <div class="shape">
        <div class="circle"></div>
        <p class="circle-p">This is a perfect circle</p>
        <div class="oval"></div>
        <p class="oval-p">This is an oval shape</p>
        <div class="rectangle"></div>
        <p class="rectangle-p">This is a rectangle</p>
        <div class="triangle"></div>
        <p class="triangle-p">This is a triangle</p>
    </div>
</body>
</html>
